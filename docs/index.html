<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="每天更新前一天的 GitHub 热门仓库，支持手机浏览、搜索、筛选、收藏和中文翻译。">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GitHub 日报">
  <title>GitHub 日报</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-icon" src="favicon.svg" alt="" width="38" height="38">
        <div class="brand-text">
          <h1>GitHub 日报</h1>
          <p>每天更新前一天的榜单</p>
        </div>
      </div>
      <div class="date-nav" aria-label="切换日期">
        <button id="prevDate" class="icon-btn" type="button" aria-label="前一天" title="前一天">‹</button>
        <select id="dateSelect" aria-label="选择日期" disabled>
          <option value="">加载中…</option>
        </select>
        <button id="nextDate" class="icon-btn" type="button" aria-label="后一天" title="后一天">›</button>
        <button id="sharePage" class="icon-btn share-btn" type="button" aria-label="分享给朋友" title="分享给朋友">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="筛选榜单">
      <div class="tabs" role="tablist" aria-label="榜单分类">
        <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="all">全部</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="new">新项目</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="high" title="总 Star 超过 1000">高星</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="fav">收藏 <span id="favCount" class="count"></span></button>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="搜索仓库、描述或 topic" autocomplete="off" spellcheck="false" aria-label="搜索仓库">
        <select id="language" aria-label="按语言筛选">
          <option value="">全部语言</option>
        </select>
        <select id="sort" aria-label="排序方式">
          <option value="default">综合排序</option>
          <option value="today">今日涨星</option>
          <option value="stars">按 Star 数</option>
          <option value="created">按创建时间</option>
        </select>
      </div>
    </section>

    <div id="meta" class="meta" aria-live="polite"></div>
    <section id="list" class="list" aria-live="polite"></section>
    <p class="footnote">
      数据来自 GitHub Trending 与 GitHub Search API。每天北京时间 08:05 自动更新前一天内容。
    </p>
  </main>

  <div id="detailOverlay" class="detail-overlay" hidden>
    <section id="detailDialog" class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div class="detail-heading">
          <button id="detailBack" class="detail-back" type="button" aria-label="返回列表">‹ 返回列表</button>
          <p class="detail-kicker">仓库详情</p>
          <h2 id="detailTitle" class="detail-title"></h2>
        </div>
        <button id="detailClose" class="detail-close" type="button" aria-label="关闭详情">×</button>
      </div>
      <div class="detail-body">
        <p id="detailDesc" class="detail-desc"></p>
        <div id="detailMeta" class="detail-meta"></div>
        <div class="detail-actions">
          <button id="detailTranslate" class="btn btn-primary" type="button">翻译全文</button>
          <a id="detailGithub" class="btn" target="_blank" rel="noopener noreferrer">打开 GitHub</a>
          <a id="detailBaidu" class="btn btn-ghost" target="_blank" rel="noopener noreferrer">百度翻译简介</a>
        </div>
        <p class="detail-hint">GitHub 无法访问时，详情、README 和翻译仍可正常使用。</p>
        <p id="translationNote" class="translation-note" hidden aria-live="polite"></p>
        <section id="readmeSection" class="readme-section" hidden>
          <div class="readme-head">
            <h3 class="readme-title">项目说明</h3>
            <span id="readmeStatus" class="readme-status"></span>
          </div>
          <div id="detailReadme" class="readme-text" aria-live="polite"></div>
          <p class="readme-note">README 由 GitHub Actions 预先抓取，手机查看不需要访问 GitHub。</p>
        </section>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">需要开启 JavaScript 才能查看榜单。</p>
  </noscript>
  <script src="app.js?v=5" type="module"></script>
</body>
</html>
